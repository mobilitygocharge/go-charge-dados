name: Espanha — postos oficiais (NAP DGT)

on:
  schedule:
    - cron: "20 4 * * 0"      # domingos (antes da atualização semanal de segunda)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  nap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Recolher NAP Espanha
        run: python scripts/es_nap.py
      - name: Gravar no repositório
        run: |
          git config user.name "go-charge-dados"
          git config user.email "go-charge-dados@users.noreply.github.com"
          git add data/es/nap
          if git diff --cached --quiet; then echo "Sem alterações."; exit 0; fi
          git commit -q -m "NAP Espanha: $(date -u +%Y-%m-%d)"
          git pull -q --rebase && git push -q
