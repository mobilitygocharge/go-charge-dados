name: Espanha — OpenStreetMap (locais candidatos)

on:
  schedule:
    - cron: "40 2 3 * *"      # dia 3 de cada mês
  workflow_dispatch:
    inputs:
      provincia:
        description: "Província (vazio = todas)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: osm-es          # recolha longa: não bloqueia a MOBI.E (grava só em data/es/osm)
  cancel-in-progress: false

jobs:
  osm_es:
    runs-on: ubuntu-24.04
    timeout-minutes: 350     # o script pára de pedir ao fim de 300 min e grava o que tiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Recolher OpenStreetMap (Espanha)
        run: python scripts/osm_es.py ${{ github.event.inputs.provincia && format('"{0}"', github.event.inputs.provincia) || '' }}
      - name: Gravar no repositório
        run: |
          git config user.name "go-charge-dados"
          git config user.email "go-charge-dados@users.noreply.github.com"
          git add data/es/osm
          if git diff --cached --quiet; then echo "Sem alterações."; exit 0; fi
          git commit -q -m "OSM Espanha: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 20; done
