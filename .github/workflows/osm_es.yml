name: Espanha — OpenStreetMap (locais candidatos)

on:
  schedule:
    - cron: "40 2 3 * *"      # dia 3 de cada mês
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-es
  cancel-in-progress: false

jobs:
  osm_es:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: pip install -q -r requirements.txt osmium shapely
      - name: Limites municipais (IGN, via es-atlas)
        run: |
          cd /tmp && npm pack -q es-atlas@0.6.0 && tar xzf es-atlas-0.6.0.tgz
          npx -y -p topojson-client@3 topo2geo municipalities=/tmp/mun.geojson < /tmp/package/es/municipalities.json
      - name: Recolher OpenStreetMap (toda a Espanha, extratos Geofabrik)
        run: MUN_GEOJSON=/tmp/mun.geojson python scripts/osm_es.py
      - name: Gravar no repositório
        run: |
          git config user.name "go-charge-dados"
          git config user.email "go-charge-dados@users.noreply.github.com"
          git add data/es/osm
          if git diff --cached --quiet; then echo "Sem alterações."; exit 0; fi
          git commit -q -m "OSM Espanha: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 20; done
