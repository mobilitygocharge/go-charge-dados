name: OpenStreetMap (locais candidatos)

on:
  schedule:
    - cron: "40 2 2 * *"      # dia 2 de cada mês
  workflow_dispatch:
    inputs:
      zona:
        description: "Zona (vazio = todas)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  osm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Recolher OpenStreetMap
        run: python scripts/osm_sync.py ${{ github.event.inputs.zona && format('"{0}"', github.event.inputs.zona) || '' }}
      - name: Gravar no repositório
        run: |
          git config user.name "go-charge-dados"
          git config user.email "go-charge-dados@users.noreply.github.com"
          git add data/osm
          if git diff --cached --quiet; then echo "Sem alterações."; exit 0; fi
          git commit -q -m "OSM: $(date -u +%Y-%m-%d)"
          git pull -q --rebase && git push -q
