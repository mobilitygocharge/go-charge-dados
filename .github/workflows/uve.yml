name: Observatório UVE (utilização por município)

on:
  schedule:
    - cron: "20 4 6 * *"      # dia 6 de cada mês (o observatório fecha o mês anterior nos primeiros dias)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  uve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Recolher utilização por município
        run: python scripts/uve.py
      - name: Gravar no repositório
        run: |
          git config user.name "go-charge-dados"
          git config user.email "go-charge-dados@users.noreply.github.com"
          git add data/uve
          if git diff --cached --quiet; then echo "Sem alterações."; exit 0; fi
          git commit -q -m "UVE: $(date -u +%Y-%m-%d)"
          git pull -q --rebase && git push -q
