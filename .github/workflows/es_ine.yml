name: Espanha — INE (população, renda, turismo)

on:
  schedule:
    - cron: "10 5 15 * *"      # dia 15 de cada mês (dados anuais/mensais do INE)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  ine:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Recolher INE Espanha
        run: python scripts/es_ine.py
      - name: Gravar no repositório
        run: |
          git config user.name "go-charge-dados"
          git config user.email "go-charge-dados@users.noreply.github.com"
          git add data/es
          if git diff --cached --quiet; then echo "Sem alterações."; exit 0; fi
          git commit -q -m "INE Espanha: $(date -u +%Y-%m-%d)"
          git pull -q --rebase && git push -q
